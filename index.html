<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MandarinVerse — Belajar Mandarin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="authView" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="brand-mark">文</div><h1>MandarinVerse</h1><p class="muted">Mulai perjalanan Mandarin-mu.</p>
      <div class="tabs"><button id="loginTab" class="active">Login</button><button id="registerTab">Daftar</button></div>
      <form id="authForm">
        <label>Nama tampilan<input id="displayName" placeholder="Dika" autocomplete="name"></label>
        <label>Email<input id="email" type="email" required autocomplete="email" placeholder="nama@email.com"></label>
        <label>Password<input id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="Minimal 6 karakter"></label>
        <button class="primary full" type="submit" id="authSubmit">Login</button>
      </form><p id="authMessage" class="message"></p>
    </div>
  </div>
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">文</span><div><b>MandarinVerse</b><small>你的中文旅程</small></div></div>
      <nav>
        <button class="nav-btn active" data-page="dashboard">⌂ Dashboard</button>
        <button class="nav-btn" data-page="lesson">▤ Pelajaran</button>
        <button class="nav-btn" data-page="vocabulary">文 Vocabulary</button>
        <button class="nav-btn" data-page="review">↻ Review Center</button>
        <button class="nav-btn" data-page="exam">★ Ujian Mingguan</button>
      </nav>
      <div class="side-bottom"><div class="user-mini"><div class="avatar" id="avatar">D</div><div><b id="sideName">Pengguna</b><small id="sideLevel">Level 0</small></div></div><button id="logoutBtn" class="logout">Keluar ↗</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><span class="eyebrow">MANDARIN LEARNING SPACE</span><h2 id="greeting">Nǐ hǎo!</h2><p id="greetingSub" class="muted">Siap belajar sesuatu yang baru hari ini?</p></div><div class="top-pill">🔥 <b id="streak">0</b> hari streak</div></header>
      <section id="pageContent"></section>
      <footer>MandarinVerse <span>•</span> 学习中文，每天进步一点</footer>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body></html>
